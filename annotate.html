<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golu Hunt: box annotator</title>
    <style>
      body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #0a3138; color: #f7f2e6; display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
      aside { padding: 1rem; overflow: auto; border-right: 1px solid #1d5a64; display: grid; gap: 0.75rem; align-content: start; }
      h1 { font-size: 1.1rem; margin: 0; }
      p { margin: 0; color: #a9c3c1; }
      select, button { font: inherit; padding: 0.35rem 0.6rem; }
      #canvas-wrap { position: relative; overflow: auto; }
      canvas { display: block; cursor: crosshair; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
      li { display: flex; justify-content: space-between; gap: 0.5rem; padding: 2px 4px; }
      li.sel { background: #1d5a64; }
      li button { padding: 0 0.4rem; }
      textarea { width: 100%; height: 8rem; font: 11px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Box annotator</h1>
      <p>Pick a photo and a doll, then drag a box around the doll. Dragging again replaces that doll's box on this photo. Close-ups are 05–13; photos 01 and 03 are the wide shots.</p>
      <label>Photo <select id="photo"></select></label>
      <label>Doll <select id="doll"></select></label>
      <ul id="list"></ul>
      <button id="download">Download boxes.json</button>
      <button id="copy">Copy JSON</button>
      <p>Save the file over <code>data/boxes.json</code>, then run <code>npm run build-index</code>.</p>
      <textarea id="out" readonly></textarea>
    </aside>
    <div id="canvas-wrap"><canvas id="cv"></canvas></div>
    <script type="module" src="/src/annotate.ts"></script>
  </body>
</html>
